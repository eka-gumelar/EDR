<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Station Daily Report Portal</title>
    
    <!-- Menambahkan Ikon Web (Favicon) untuk Tab Browser -->
    <link rel="icon" type="image/png" href="./assets/icons/favicon.png">

    <style>
        /* ==========================================================================
           CSS VARIABLES & ANIMATIONS
           ========================================================================== */
        :root {
            --slate-50: #f8fafc;
            --slate-100: #f1f5f9;
            --slate-200: #e2e8f0;
            --slate-300: #cbd5e1;
            --slate-400: #94a3b8;
            --slate-500: #64748b;
            --slate-600: #475569;
            --slate-700: #334155;
            --slate-800: #1e293b;
            --slate-900: #0f172a;

            --blue-300: #93c5fd;
            --blue-500: #3b82f6;
            --blue-600: #2563eb;
            --blue-700: #1d4ed8;

            --teal-200: #99f6e4;
            --teal-300: #5eead4;
            --teal-500: #14b8a6;
            --teal-600: #0d9488;
            --teal-700: #0f766e;
            --teal-800: #115e59;
            --teal-900: #134e4a;
            
            --white: #ffffff;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes titleGlow {
            0% { filter: drop-shadow(0 0 15px rgba(37,99,235,0.05)); }
            50% { filter: drop-shadow(0 0 25px rgba(37,99,235,0.2)); }
            100% { filter: drop-shadow(0 0 15px rgba(37,99,235,0.05)); }
        }

        /* ==========================================================================
           RESET & BASE STYLES
           ========================================================================== */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--slate-800);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
            /* Ambient glowing background (Menenangkan mata) */
            background-color: var(--slate-50);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(20, 184, 166, 0.08) 0%, transparent 50%),
                radial-gradient(var(--slate-200) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 20px 20px;
        }

        button { background: none; border: none; cursor: pointer; font-family: inherit; }

        /* ==========================================================================
           LAYOUT & COMPONENTS
           ========================================================================== */
        .container { width: 100%; max-width: 1024px; animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Header Utama - Menggunakan vh agar jarak menyusut otomatis di layar pendek */
        .page-header { text-align: center; margin-bottom: 3vh; }
        
        .header-icon-box {
            display: inline-flex; align-items: center; justify-content: center;
            margin-bottom: 1.5vh; color: var(--slate-800);
            transform: translateY(0); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .header-icon-box:hover { transform: translateY(-5px) scale(1.05); }

        .page-header h1 {
            font-size: clamp(2rem, 4vw, 2.75rem); font-weight: 900; letter-spacing: -0.03em; margin-bottom: 0.5rem;
            color: transparent; background: linear-gradient(90deg, var(--slate-900), var(--slate-700));
            -webkit-background-clip: text; background-clip: text;
            animation: titleGlow 4s infinite alternate;
        }
        .page-header h1 span { 
            background: linear-gradient(90deg, var(--blue-600), var(--teal-500)); 
            -webkit-background-clip: text; color: transparent; 
        }
        .page-header p { color: var(--slate-500); font-size: 1rem; font-weight: 500; max-width: 42rem; margin: 0 auto; line-height: 1.6; }

        @media (min-width: 640px) {
            .page-header h1 { font-size: 3rem; }
            .page-header p { font-size: 1.15rem; }
        }

        /* Grid Utama */
        .main-grid { display: flex; align-items: center; justify-content: center; width: 100%; max-width: 1000px; margin: 0 auto; }

        /* Card / Kotak Sentral - KOTAK KACA (GLASSMORPHISM) */
        .card {
            background-color: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-radius: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.08), inset 0 0 0 1px rgba(255,255,255,0.6);
            border: 1px solid rgba(255, 255, 255, 0.8);
            padding: clamp(2rem, 5vh, 4rem); 
            width: 100%;
        }

        /* Grid Kotak Menu - FIXED 3 KOLOM */
        .menu-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: clamp(1.5rem, 3vh, 2.5rem); 
            width: 100%;
        }

        @media (max-width: 640px) {
            /* Responsif aman untuk layar HP sempit agar ikon tidak gepeng */
            .menu-grid { grid-template-columns: repeat(2, 1fr); }
        }

        /* ==========================================================================
           BUTTONS & INTERACTION
           ========================================================================== */
        
        .btn-menu {
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
            width: 100%; padding: clamp(0.5rem, 1.5vh, 1rem); background: transparent; border: none;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); gap: clamp(0.75rem, 1.5vh, 1.25rem); text-decoration: none;
            position: relative; z-index: 1;
            /* Staggered entrance animation applied to buttons */
            opacity: 0; animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Teks Menu Proporsional */
        .btn-menu span {
            font-size: 1.15rem; 
            font-weight: 800;
            color: var(--slate-700);
            letter-spacing: 0.02em;
            transition: color 0.3s ease;
        }

        /* Delay agar muncul bergelombang */
        .btn-menu:nth-child(1) { animation-delay: 0.1s; }
        .btn-menu:nth-child(2) { animation-delay: 0.15s; }
        .btn-menu:nth-child(3) { animation-delay: 0.2s; }
        .btn-menu:nth-child(4) { animation-delay: 0.25s; }
        .btn-menu:nth-child(5) { animation-delay: 0.3s; }
        .btn-menu:nth-child(6) { animation-delay: 0.35s; }

        .btn-menu:hover {
            transform: translateY(-10px) scale(1.05);
        }
        .btn-menu:hover span {
            color: var(--blue-600);
        }

        /* Efek khusus untuk SVG / IMG saat hover (Glow Halus) */
        .btn-menu svg, .btn-menu img {
            color: var(--slate-400); 
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.05));
        }

        .btn-menu:hover svg, .btn-menu:hover img { 
            transform: scale(1.1) translateY(-4px); 
            filter: drop-shadow(0 15px 25px rgba(59,130,246,0.3)); 
            color: var(--blue-500);
        }

        /* Footer - Margin menggunakan vh */
        footer { margin-top: 4vh; margin-bottom: 1vh; text-align: center; color: var(--slate-400); font-size: 0.9rem; font-weight: 600; letter-spacing: 0.05em; }

        /* Aturan SVG & IMG Global - UKURAN PROPORSIONAL (80px) AGAR MUAT 1 LAYAR */
        svg.icon, img.icon { width: 80px; height: 80px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; object-fit: contain; }
        svg.icon-lg, img.icon-lg { width: 64px; height: 64px; object-fit: contain; }
    </style>
</head>
